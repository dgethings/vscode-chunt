<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- chunt: Cisco IOS Jinja2 template language server -->
  <!-- Rounded-square navy background -->
  <rect x="0" y="0" width="128" height="128" rx="24" ry="24" fill="#0B2B3C"/>

  <!-- Jinja2 braces, Cisco blue -->
  <g fill="none" stroke="#049FD9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- left brace { -->
    <path d="M 44 22
             C 36 22 34 27 34 35
             L 34 52
             C 34 59 30 64 23 64
             C 30 64 34 69 34 76
             L 34 93
             C 34 101 36 106 44 106"/>
    <!-- right brace } -->
    <path d="M 84 22
             C 92 22 94 27 94 35
             L 94 52
             C 94 59 98 64 105 64
             C 98 64 94 69 94 76
             L 94 93
             C 94 101 92 106 84 106"/>
  </g>

  <!-- Network topology inside the braces: 4 nodes in a square, fully linked -->
  <g>
    <g stroke="#7FD6F5" stroke-width="3.5" stroke-linecap="round">
      <line x1="55" y1="48" x2="55" y2="82"/>
      <line x1="73" y1="48" x2="73" y2="82"/>
      <line x1="55" y1="48" x2="73" y2="82"/>
      <line x1="73" y1="48" x2="55" y2="82"/>
    </g>
    <g fill="#049FD9" stroke="#9FE3FF" stroke-width="2.5">
      <circle cx="55" cy="48" r="7"/>
      <circle cx="73" cy="48" r="7"/>
      <circle cx="55" cy="82" r="7"/>
      <circle cx="73" cy="82" r="7"/>
    </g>
  </g>
</svg>
