name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Compile
        run: npm run compile
      - name: Lint
        run: npm run lint
      - name: Package (smoke)
        run: npx @vscode/vsce package --no-dependencies -o /tmp/chunt-smoke.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-vsix
          path: /tmp/chunt-smoke.vsix
